# SPDX-License-Identifier: MIT
---
name: Validate lintro version

"on":
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
      - .github/workflows/validate-lintro-version.yml
  merge_group:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
      - .github/workflows/validate-lintro-version.yml

permissions: {}

concurrency:
  group: validate-lintro-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-lintro-version.yml@17483d234808cb3a2019afdff0dea29593f24a05
    with:
      tooling-ref: "17483d234808cb3a2019afdff0dea29593f24a05"
      # Consumer repos must pass lintro-image: resolve-lintro-image.sh
      # defaults to lgtm-ci-owned paths that do not exist here. Keep this
      # digest in lockstep with pyproject.toml's lintro== pin and the
      # lintro-image override on ci.yml's quality job (py-lintro 0.74.0).
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:ec90de3fd989e93be9c6734562e4d6217deb16bccd33d192b48fb8fe2ec54514
      egress-policy: block
      egress-preset: quality
    permissions:
      # read: pyproject.toml and workflow files for the version-sync check
      contents: read
      # read: pull the pinned py-lintro image from GHCR
      packages: read
