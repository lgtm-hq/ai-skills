# SPDX-License-Identifier: MIT
---
name: Validate lintro version

"on":
  # No path filter on pull_request / merge_group: this check is required by
  # ruleset checks-validate-lintro, so it must always report a conclusion.
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
      - .github/workflows/validate-lintro-version.yml
      - renovate.json

permissions: {}

concurrency:
  group: validate-lintro-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-lintro-version.yml@ee8484ca71db3a2c2c33da6128bbf2330fcd7c88  # v0.59.2
    with:
      tooling-ref: "ee8484ca71db3a2c2c33da6128bbf2330fcd7c88"  # v0.59.2
      # Consumer repos must pass lintro-image: resolve-lintro-image.sh
      # defaults to lgtm-ci-owned paths that do not exist here. Keep this
      # digest in lockstep with pyproject.toml's lintro== pin and the
      # lintro-image override on ci.yml's quality job (py-lintro 0.77.1).
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:78fd471dc6c32f382a13bf94e7a0de8241d997805b5c77ed2423e46f5b677e9a
      egress-policy: block
      egress-preset: quality
    permissions:
      # read: pyproject.toml and workflow files for the version-sync check
      contents: read
      # read: pull the pinned py-lintro image from GHCR
      packages: read
