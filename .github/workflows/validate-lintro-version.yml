# SPDX-License-Identifier: MIT
---
name: Validate lintro version

"on":
  # No path filter on pull_request / merge_group: this check is required by
  # ruleset checks-validate-lintro, so it must always report a conclusion.
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
      - .github/workflows/validate-lintro-version.yml
      - renovate.json

permissions: {}

concurrency:
  group: validate-lintro-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-lintro-version.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2  # v0.63.1
    with:
      tooling-ref: "23c79b65490a3307fb08cdefafa22db12f75b9b2"  # v0.63.1
      # Consumer repos must pass lintro-image: resolve-lintro-image.sh
      # defaults to lgtm-ci-owned paths that do not exist here. Keep this
      # digest in lockstep with pyproject.toml's lintro== pin and the
      # lintro-image override on ci.yml's quality job (py-lintro 0.105.0).
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:58953014c100723a5de29b517b5710bd17cb380fc40479c41a94458732dd04c0
      egress-policy: block
      egress-preset: quality
    permissions:
      # read: pyproject.toml and workflow files for the version-sync check
      contents: read
      # read: pull the pinned py-lintro image from GHCR
      packages: read
