# SPDX-License-Identifier: MIT
---
name: Validate lintro version

"on":
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
      - .github/workflows/validate-lintro-version.yml
  merge_group:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
      - .github/workflows/validate-lintro-version.yml

permissions: {}

concurrency:
  group: validate-lintro-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-lintro-version.yml@17483d234808cb3a2019afdff0dea29593f24a05
    with:
      tooling-ref: "17483d234808cb3a2019afdff0dea29593f24a05"
      # Consumer repos must pass lintro-image: resolve-lintro-image.sh
      # defaults to lgtm-ci-owned paths that do not exist here. This digest
      # is the reusable-quality-lint.yml default at the pinned ref
      # (py-lintro 0.64.1); pyproject.toml pins lintro==0.64.1 to match.
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:1ff3db35939283734b859c7c5d95be87fd8fd62734b3434e0437769d50d53578
      egress-policy: block
      egress-preset: quality
    permissions:
      # read: pyproject.toml and workflow files for the version-sync check
      contents: read
      # read: pull the pinned py-lintro image from GHCR
      packages: read
