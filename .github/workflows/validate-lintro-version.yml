# SPDX-License-Identifier: MIT
---
name: Validate lintro version

"on":
  # No path filter on pull_request / merge_group: this check is required by
  # ruleset checks-validate-lintro, so it must always report a conclusion.
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
      - .github/workflows/validate-lintro-version.yml
      - renovate.json

permissions: {}

concurrency:
  group: validate-lintro-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-lintro-version.yml@f8f58587e4c324f6f0c9b3b4f59cfc93aa7d5d0f  # v0.69.6
    with:
      tooling-ref: "f8f58587e4c324f6f0c9b3b4f59cfc93aa7d5d0f" # v0.69.6
      # Consumer repos must pass lintro-image: resolve-lintro-image.sh
      # defaults to lgtm-ci-owned paths that do not exist here. Keep this
      # digest in lockstep with pyproject.toml's lintro== pin and the
      # lintro-image override on ci.yml's quality job (py-lintro 0.142.0).
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:3d21fd16b955d476a6908136dac412a112466cda908422df40c790b1124d550a
      egress-policy: block
      egress-preset: quality
    permissions:
      # read: pyproject.toml and workflow files for the version-sync check
      contents: read
      # read: pull the pinned py-lintro image from GHCR
      packages: read
