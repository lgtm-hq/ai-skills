# SPDX-License-Identifier: MIT
---
name: Validate lintro version

'on':
  # No path filter on pull_request / merge_group: this check is required by
  # ruleset checks-validate-lintro, so it must always report a conclusion.
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
      - .github/workflows/validate-lintro-version.yml
      - renovate.json

permissions: {}

concurrency:
  group: validate-lintro-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-lintro-version.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
      # Consumer repos must pass lintro-image: resolve-lintro-image.sh
      # defaults to lgtm-ci-owned paths that do not exist here. Keep this
      # digest in lockstep with pyproject.toml's lintro== pin and the
      # lintro-image override on ci.yml's quality job.
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:087b6c6a24830c0904aef88e8fdbcb51d1078fcef842d72f9656e21ba6e6f3fd
      egress-policy: block
      egress-preset: quality
    permissions:
      # read: pyproject.toml and workflow files for the version-sync check
      contents: read
      # read: pull the pinned py-lintro image from GHCR
      packages: read
