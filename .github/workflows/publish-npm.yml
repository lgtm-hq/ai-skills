---
name: Publish npm package

'on':
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v1.2.3
        required: true
        type: string
      dry_run:
        description: Verify the npm tarball without publishing it
        default: true
        required: true
        type: boolean
      dist_tag:
        description: npm dist-tag to publish under
        default: latest
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-npm-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-26.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      LIVE: >-
        ${{ github.event_name == 'release' && '1'
        || inputs.dry_run == false && '1' || '0' }}
      NPM_DIST_TAG: >-
        ${{ github.event.release.prerelease && 'next'
        || inputs.dist_tag || 'latest' }}

    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            actions.githubusercontent.com:443
            token.actions.githubusercontent.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            releases.astral.sh:443
            nodejs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            oauth2.sigstore.dev:443

      - name: Checkout release tag
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        # Node 24 ships npm >= 11.5.1, required for OIDC trusted publishing.
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org

      - name: Read canonical Bun version
        id: bun-version
        run: bash scripts/ci/npm/read_bun_version.sh
      - name: Set up Bun
        # yamllint disable-line rule:line-length
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-version.outputs.bun-version }}

      - name: Set up Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Set up uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Bake vendor plugins
        run: bash scripts/ci/bake_vendor_plugins_gate.sh

      - name: Fetch locked capability artifact sources
        run: uv run ai-skills-engine lock --fetch

      - name: Check the resolution lock
        run: uv run ai-skills-engine lock --check

      - name: Rebuild capability artifacts offline from the lock
        # Fails closed if any rebuilt artifactDigest differs from ai-skills.lock.
        run: uv run ai-skills-engine build

      - name: Build and verify gateway package
        run: bash scripts/ci/npm/check_ai_skills_package.sh

      - name: Synchronize package version and catalog
        run: >-
          uv run python scripts/ci/npm/sync_ai_skills_package.py
          --version "$RELEASE_TAG"

      - name: Verify package synchronization
        run: >-
          uv run python scripts/ci/npm/sync_ai_skills_package.py
          --check --version "$RELEASE_TAG"

      - name: Build release launcher
        working-directory: npm/ai-skills
        run: bun run build

      - name: Verify release tarball
        working-directory: npm/ai-skills
        run: bun scripts/check-pack.ts

      - name: Publish package
        run: scripts/ci/npm/publish_ai_skills_package.sh
