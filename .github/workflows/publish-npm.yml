---
name: Publish npm package

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v1.2.3
        required: true
        type: string
      dry_run:
        description: Verify the npm tarball without publishing it
        default: true
        required: true
        type: boolean
      dist_tag:
        description: npm dist-tag to publish under
        default: latest
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-npm-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      LIVE: >-
        ${{ github.event_name == 'release' && '1'
        || inputs.dry_run == false && '1' || '0' }}
      NPM_DIST_TAG: >-
        ${{ github.event.release.prerelease && 'next'
        || inputs.dist_tag || 'latest' }}

    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout release tag
        # yamllint disable-line rule:line-length
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        # Node 24 ships npm >= 11.5.1, required for OIDC trusted publishing.
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.0.0

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Synchronize package version and catalog
        run: >-
          uv run python scripts/ci/npm/sync_ai_skills_package.py
          --version "$RELEASE_TAG"

      - name: Verify package synchronization
        run: >-
          uv run python scripts/ci/npm/sync_ai_skills_package.py
          --check --version "$RELEASE_TAG"

      - name: Publish package
        run: scripts/ci/npm/publish_ai_skills_package.sh
