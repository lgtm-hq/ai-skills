---
name: Publish npm package

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v1.2.3
        required: true
        type: string
      dry_run:
        description: Verify the npm tarball without publishing it
        default: true
        required: true
        type: boolean
      dist_tag:
        description: npm dist-tag to publish under
        default: latest
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-npm-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      LIVE: >-
        ${{ github.event_name == 'release' && '1'
        || inputs.dry_run == false && '1' || '0' }}
      NPM_DIST_TAG: >-
        ${{ github.event.release.prerelease && 'next'
        || inputs.dist_tag || 'latest' }}

    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout release tag
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        # Node 24 ships npm >= 11.5.1, required for OIDC trusted publishing.
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Synchronize package version and catalog
        run: >-
          uv run python scripts/ci/npm/sync_ai_skills_package.py
          --version "$RELEASE_TAG"

      - name: Verify package synchronization
        run: >-
          uv run python scripts/ci/npm/sync_ai_skills_package.py
          --check --version "$RELEASE_TAG"

      - name: Verify vendor plugin bake
        run: uv run python scripts/bake_vendor_plugins.py --check

      - name: Publish package
        run: scripts/ci/npm/publish_ai_skills_package.sh
