---
name: Vendor pin regeneration

'on':
  pull_request:
    types: [opened, synchronize]
    paths: [vendors.yaml]

permissions:
  contents: read

concurrency:
  group: vendor-pin-regen-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate vendor catalog
    if: >-
      startsWith(github.head_ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            astral.sh:443
            releases.astral.sh:443

      - name: Checkout PR head
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Regenerate and summarize selected pins
        id: regenerate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUMMARY_PATH: ${{ runner.temp }}/vendor-pin-summary.md
        run: bash scripts/ci/vendor_pin_regen.sh

      - name: Create release App token
        id: app-token
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit generated data and upsert summary
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY_PATH: ${{ runner.temp }}/vendor-pin-summary.md
          SUMMARY_STATUS: ${{ steps.regenerate.outputs.summary-status }}
        run: uv run python scripts/ci/create_signed_commit.py
