---
name: CodeQL

"on":
  push:
    branches: [main]
    paths: ['**.py', 'pyproject.toml', '.github/**']
  pull_request:
    branches: [main]
    # No paths filter: when `codeql` is promoted to a required status check,
    # a path-filtered workflow that does not run leaves the required context
    # absent (not skipped), which permanently blocks the merge queue for PRs
    # that touch only non-matching files (docs, skills/, etc.). Always run on
    # PRs so the check always reports.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL
    # Scans the repo's only Python sources (scripts/ and tests/). build-mode
    # is none: Python is interpreted, so the database is built from source
    # without a build step (do not use autobuild for interpreted languages).
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-codeql.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    with:
      languages: python
      build-mode: none
      tooling-ref: 'c14fbb654af2fc59c4abd7435e85a269a57057fc' # v0.69.2
      egress-policy: block
      egress-preset: github-tooling
      # Harden-runner pre reads workflow inputs only (not resolved presets).
      # Full list = reusable default + release-assets (CodeQL bundle download
      # from github/codeql-action releases redirects there).
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        release-assets.githubusercontent.com:443
    permissions:
      # read: checkout repository for CodeQL analysis
      contents: read
      # write: upload CodeQL findings to the Security tab
      security-events: write
