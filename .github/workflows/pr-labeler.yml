---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label:
    # lgtm-ci owns the labeling logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@2097a900753e3e5ad0e336483501b278e99855ae # v0.78.1
    with:
      job-name: '🏷️ Auto Label PR'
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '2097a900753e3e5ad0e336483501b278e99855ae' # v0.78.1
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
