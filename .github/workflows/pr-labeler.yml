---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label:
    # lgtm-ci owns the labeling logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-labeler.yml@22bb159287eb23a812d533090615525eccb839ac # v0.75.1
    with:
      job-name: '🏷️ Auto Label PR'
      configuration-path: .github/labeler.yml
      sync-labels: false
      tooling-ref: '22bb159287eb23a812d533090615525eccb839ac' # v0.75.1
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      pull-requests: write
