---
name: "Release: Auto Tag"

"on":
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:
    inputs:
      version:
        description: "The version to tag, for example 1.2.3"
        required: true
        type: string

concurrency:
  group: release-auto-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-tag:
    # lgtm-ci owns tag/release creation; this repo only supplies trigger policy.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-auto-tag.yml@79444626c1b3afa4d959b5840b4b5310a46a4095
    with:
      version: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.version
            || '' }}
      tooling-ref: "79444626c1b3afa4d959b5840b4b5310a46a4095"
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
