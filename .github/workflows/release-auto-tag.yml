---
name: 'Release: Auto Tag'

'on':
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to tag, for example 1.2.3'
        required: true
        type: string

concurrency:
  group: release-auto-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  auto-tag:
    # lgtm-ci owns tag/release creation; this repo only supplies trigger policy.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-auto-tag.yml@614c5ad1fc91d742baed959643bdd1f261a71210 # v0.79.1
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      version: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.version
            || '' }}
      tooling-ref: '614c5ad1fc91d742baed959643bdd1f261a71210' # v0.79.1
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      # report-release-failure job: read run metadata, file failure issues.
      actions: read
      issues: write
