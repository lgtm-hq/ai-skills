---
name: "Release: SBOM"

"on":
  release:
    types: [published]
  # Manual backfill must target a release tag ref in the Actions UI
  # (not a branch). The job if-guard below rejects non-tag dispatches.
  workflow_dispatch:

concurrency:
  group: release-sbom-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sbom:
    # release events always have a tag; manual runs must select a tag ref
    # so the reusable job scans/attests the intended release commit.
    if: >-
      github.event_name == 'release'
      || startsWith(github.ref, 'refs/tags/')
    # lgtm-ci owns SBOM generation; this repo stays a thin caller.
    # Complements the release-manifest attestation with a signed CycloneDX
    # SBOM (plus vulnerability scan) for every published release.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@666482503128c40a09ed21b955456e46d6bdfcbe  # v0.63.0
    with:
      target: "."
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      artifact-name: sbom
      tooling-ref: "666482503128c40a09ed21b955456e46d6bdfcbe" # v0.63.0
      egress-policy: block
      egress-preset: sbom
      # Harden-runner pre reads inputs only. Include uploads.github.com and
      # github-releases.githubusercontent.com so anchore/sbom-action can attach
      # (and fetch) CycloneDX assets on the release CDN path.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        release-assets.githubusercontent.com:443
        github-releases.githubusercontent.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        anchore.io:443
        get.anchore.io:443
        toolbox-data.anchore.io:443
        grype.anchore.io:443
        pipelines.actions.githubusercontent.com:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        timestamp.sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        sigstore-tuf-root.storage.googleapis.com:443
    permissions:
      # contents:write — attach the CycloneDX SBOM to the GitHub Release
      # (anchore/sbom-action upload-release-assets). Read alone fails with
      # "Resource not accessible by integration". security-events / id-token /
      # attestations cover SARIF + OIDC attestation signing.
      contents: write
      security-events: write
      id-token: write
      attestations: write
