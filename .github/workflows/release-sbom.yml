---
name: "Release: SBOM"

"on":
  release:
    types: [published]
  # Manual backfill must target a release tag ref in the Actions UI
  # (not a branch). The job if-guard below rejects non-tag dispatches.
  workflow_dispatch:

concurrency:
  group: release-sbom-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sbom:
    # release events always have a tag; manual runs must select a tag ref
    # so the reusable job scans/attests the intended release commit.
    if: >-
      github.event_name == 'release'
      || startsWith(github.ref, 'refs/tags/')
    # lgtm-ci owns SBOM generation; this repo stays a thin caller.
    # Complements the release-manifest attestation with a signed CycloneDX
    # SBOM (plus vulnerability scan) for every published release.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-sbom.yml@17483d234808cb3a2019afdff0dea29593f24a05
    with:
      target: "."
      target-type: dir
      sbom-format: cyclonedx-json
      scan-vulnerabilities: true
      create-attestation: true
      artifact-name: sbom
      tooling-ref: "17483d234808cb3a2019afdff0dea29593f24a05"
      egress-policy: block
      egress-preset: sbom
    permissions:
      # contents:write — attach the CycloneDX SBOM to the GitHub Release
      # (anchore/sbom-action upload-release-assets). Read alone fails with
      # "Resource not accessible by integration". security-events / id-token /
      # attestations cover SARIF + OIDC attestation signing.
      contents: write
      security-events: write
      id-token: write
      attestations: write
