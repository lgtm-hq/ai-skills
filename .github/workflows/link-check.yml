---
name: Link Check

# The repo is almost entirely Markdown (skills, docs, README) and links were
# unchecked. Two jobs split the work by cost and determinism:
#   * internal-links gates every PR. It runs Lychee offline (check-external:
#     false), so it only verifies relative/local links and never touches the
#     network for targets — deterministic, non-flaky, safe as a PR check.
#   * external-links runs on a schedule (and on demand). It validates external
#     HTTP(S) links, which are inherently flaky (rate limits, transient 5xx),
#     so it is kept off the PR path to avoid blocking merges on link rot.

"on":
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly, Monday 06:00 UTC — surfaces external link rot without gating PRs.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  internal-links:
    # PR / merge-queue gate: offline, so egress stays hardened (block) with the
    # github-tooling preset that the reusable needs to check out its scripts.
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'merge_group'
    # pull-requests: write is required by the reusable's nested
    # publish-link-check-report job declaration even when publishing is off
    # (GitHub validates callee permissions at call time).
    permissions:
      contents: read
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-link-check.yml@666482503128c40a09ed21b955456e46d6bdfcbe  # v0.63.0
    with:
      job-name: "🔗 Internal Link Check"
      file-extensions: md
      check-external: false
      tooling-ref: "666482503128c40a09ed21b955456e46d6bdfcbe" # v0.63.0
      # reusable-link-check hardens with inputs.allowed-endpoints before
      # checkout (append/preset resolve happens too late). Pass the full
      # github-tooling default list plus release-assets so Lychee can download
      # its binary without dropping github.com from the early harden step.
      # Use folded `>` like other workflows — literal `|` was parsed as a single
      # host with port 0 by harden-runner, blocking checkout.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        release-assets.githubusercontent.com:443

  external-links:
    # Scheduled / manual only. External checking needs egress to arbitrary
    # documentation hosts, so the fixed github-tooling allowlist cannot apply;
    # harden-runner runs in audit mode to monitor (not block) egress here.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-link-check.yml@666482503128c40a09ed21b955456e46d6bdfcbe  # v0.63.0
    with:
      job-name: "🔗 External Link Check"
      file-extensions: md
      check-external: true
      egress-policy: audit
      tooling-ref: "666482503128c40a09ed21b955456e46d6bdfcbe" # v0.63.0
