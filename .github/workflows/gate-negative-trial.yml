---
# Throwaway (never merged): a job that fails late, so the all-checks gate
# must wait for it and then fail.
name: Gate negative trial

"on":
  pull_request:

permissions: {}

jobs:
  slow-fail:
    name: Deliberate slow failure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Sleep, then fail
        run: sleep 90 && exit 1
