---
name: PR - Title Validation
# Validates PR titles follow Conventional Commits format.

'on':
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: semantic-pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # lgtm-ci owns the title validation; this repo stays a thin caller.
  semantic-title:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-semantic-pr-title.yml@f63b85534ce3a561f177c4ee3417b17c04f14a8b # v0.83.1
    with:
      job-name: '📝 Validate PR Title'
      tooling-ref: 'f63b85534ce3a561f177c4ee3417b17c04f14a8b' # v0.83.1
      egress-policy: block
      egress-preset: github-tooling
      comment-marker: '<!-- semantic-pr-title -->'
    permissions:
      contents: read
      # post-failure-comment (default: true) upserts failure comments on the PR
      pull-requests: write
