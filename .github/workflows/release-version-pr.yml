---
name: "Release: Create Version PR"

"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # lgtm-ci owns the release lifecycle; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@fc73b3ab8342a24597c12d137d6ff7fca84b9fe2
    with:
      max-bump: patch
      ecosystems: python
      auto-merge: true
      tooling-ref: "fc73b3ab8342a24597c12d137d6ff7fca84b9fe2"
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
