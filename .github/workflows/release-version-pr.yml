---
name: "Release: Create Version PR"

"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # lgtm-ci owns the release lifecycle; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@79444626c1b3afa4d959b5840b4b5310a46a4095
    with:
      max-bump: minor
      ecosystems: python
      auto-merge: true
      tooling-ref: "79444626c1b3afa4d959b5840b4b5310a46a4095"
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
