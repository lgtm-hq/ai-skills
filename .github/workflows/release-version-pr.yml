---
name: "Release: Create Version PR"

"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # lgtm-ci owns the release lifecycle; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    with:
      # Allow feat → minor; clamp major without an explicit break.
      max-bump: minor
      ecosystems: python
      # Keeps README install examples pinned to the release being cut.
      version-update-script: scripts/update-readme-version.sh
      auto-merge: true
      tooling-ref: "c14fbb654af2fc59c4abd7435e85a269a57057fc"  # v0.69.2
      egress-policy: block
      egress-preset: pypi
      # Harden-runner pre reads inputs only (not resolved presets).
      # Python updater needs PyPI (tomlkit) and may run uv lock.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        release-assets.githubusercontent.com:443
        pypi.org:443
        files.pythonhosted.org:443
        astral.sh:443
        releases.astral.sh:443
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      # report-release-failure job: read run metadata, file failure issues.
      actions: read
      issues: write
