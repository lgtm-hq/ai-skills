---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@768a6b72f0a5346b5ecba3f4e13b90040472341c  # v0.52.4
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "768a6b72f0a5346b5ecba3f4e13b90040472341c"  # v0.52.4
    permissions:
      contents: read
      pull-requests: write
