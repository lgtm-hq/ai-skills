---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@710c7ba40bf7b48b4d7c3442e3b60fb4b542db91 # v0.77.5
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '710c7ba40bf7b48b4d7c3442e3b60fb4b542db91' # v0.77.5
    permissions:
      contents: read
      pull-requests: write
