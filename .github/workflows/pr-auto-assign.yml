---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@66cad82ead0e5d119928c895c7d7da9c837989e5  # v0.52.3
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"  # v0.52.3
    permissions:
      contents: read
      pull-requests: write
