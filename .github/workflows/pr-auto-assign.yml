---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@2145a9aa0b1c82939be0506763442df6ea36884d  # v0.74.2
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "2145a9aa0b1c82939be0506763442df6ea36884d" # v0.74.2
    permissions:
      contents: read
      pull-requests: write
