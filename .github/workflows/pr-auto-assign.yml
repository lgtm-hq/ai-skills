---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@f63b85534ce3a561f177c4ee3417b17c04f14a8b # v0.83.1
    with:
      egress-policy: block
      codeowners-path: .github/CODEOWNERS
      tooling-ref: 'f63b85534ce3a561f177c4ee3417b17c04f14a8b' # v0.83.1
    permissions:
      contents: read
      pull-requests: write
