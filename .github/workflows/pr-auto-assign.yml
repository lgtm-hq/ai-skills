---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@f2b35cdad10df33b60c2996570b3848b70f55ed1  # v0.69.7
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "f2b35cdad10df33b60c2996570b3848b70f55ed1" # v0.69.7
    permissions:
      contents: read
      pull-requests: write
