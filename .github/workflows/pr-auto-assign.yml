---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@d32388495d571a0ee13383bacc732765bf4e9e7d  # v0.74.6
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "d32388495d571a0ee13383bacc732765bf4e9e7d" # v0.74.6
    permissions:
      contents: read
      pull-requests: write
