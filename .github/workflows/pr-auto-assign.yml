---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@2097a900753e3e5ad0e336483501b278e99855ae # v0.78.1
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '2097a900753e3e5ad0e336483501b278e99855ae' # v0.78.1
    permissions:
      contents: read
      pull-requests: write
