---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@a167ee7165319d00dc92604ecdef87b719a0a55d  # v0.74.4
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "a167ee7165319d00dc92604ecdef87b719a0a55d"  # v0.74.4
    permissions:
      contents: read
      pull-requests: write
