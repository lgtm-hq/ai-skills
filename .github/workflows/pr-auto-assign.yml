---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@31c25ef2e8992960e218524780e34f44f51271b5  # v0.54.0
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "31c25ef2e8992960e218524780e34f44f51271b5"  # v0.54.0
    permissions:
      contents: read
      pull-requests: write
