---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@22bb159287eb23a812d533090615525eccb839ac # v0.75.1
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '22bb159287eb23a812d533090615525eccb839ac' # v0.75.1
    permissions:
      contents: read
      pull-requests: write
