---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@3f5d4b551b78c2a971c47f31a241426cb69a8b6a # v0.81.0
    with:
      egress-policy: block
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '3f5d4b551b78c2a971c47f31a241426cb69a8b6a' # v0.81.0
    permissions:
      contents: read
      pull-requests: write
