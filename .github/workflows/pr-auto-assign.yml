---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@17483d234808cb3a2019afdff0dea29593f24a05
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "17483d234808cb3a2019afdff0dea29593f24a05"
    permissions:
      contents: read
      pull-requests: write
