---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2  # v0.63.1
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "23c79b65490a3307fb08cdefafa22db12f75b9b2" # v0.63.1
    permissions:
      contents: read
      pull-requests: write
