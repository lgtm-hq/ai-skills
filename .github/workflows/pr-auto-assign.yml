---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@229e00aaa727ecd88de5ab3711b07f701c4aae21 # v0.79.0
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '229e00aaa727ecd88de5ab3711b07f701c4aae21' # v0.79.0
    permissions:
      contents: read
      pull-requests: write
