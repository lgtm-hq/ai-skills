---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@6a96470c698addc35f81b5420e1e4114b35c5a03  # v0.59.1
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "6a96470c698addc35f81b5420e1e4114b35c5a03"  # v0.59.1
    permissions:
      contents: read
      pull-requests: write
