---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@234e84901ae4ac14f2d44f02fad517d95712cec3  # v0.75.0
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "234e84901ae4ac14f2d44f02fad517d95712cec3" # v0.75.0
    permissions:
      contents: read
      pull-requests: write
