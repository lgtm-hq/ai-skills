---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
    permissions:
      contents: read
      pull-requests: write
