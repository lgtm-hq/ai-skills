---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@fc73b3ab8342a24597c12d137d6ff7fca84b9fe2
    with:
      codeowners-path: .github/CODEOWNERS
    permissions:
      contents: read
      pull-requests: write
