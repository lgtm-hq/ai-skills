---
name: PR - Auto Assign

"on":
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@ee8484ca71db3a2c2c33da6128bbf2330fcd7c88  # v0.59.2
    with:
      codeowners-path: .github/CODEOWNERS
      tooling-ref: "ee8484ca71db3a2c2c33da6128bbf2330fcd7c88"  # v0.59.2
    permissions:
      contents: read
      pull-requests: write
