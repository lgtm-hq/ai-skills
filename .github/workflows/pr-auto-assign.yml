---
name: PR - Auto Assign

'on':
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  assign:
    # lgtm-ci owns assignment logic; this repo stays a thin caller.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@614c5ad1fc91d742baed959643bdd1f261a71210 # v0.79.1
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      codeowners-path: .github/CODEOWNERS
      tooling-ref: '614c5ad1fc91d742baed959643bdd1f261a71210' # v0.79.1
    permissions:
      contents: read
      pull-requests: write
