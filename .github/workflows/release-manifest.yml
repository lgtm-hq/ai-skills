---
name: "Release: Skills Manifest"

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the manifest to"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-manifest-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  manifest:
    name: Attach skills integrity manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Upload the manifest asset to the release.
      contents: write
      # Sign and store the provenance attestation.
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.tag
            || github.event.release.tag_name }}

    steps:
      - name: Harden runner
        # Pinned to SHA for supply chain security
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout release tag
        # Pinned to SHA for supply chain security
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Generate skills manifest
        run: >-
          python3 scripts/generate_skills_manifest.py
          --output skills-manifest.json

      - name: Attest build provenance
        # Pinned to SHA for supply chain security
        # yamllint disable-line rule:line-length
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: skills-manifest.json

      - name: Upload manifest to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          ASSET: skills-manifest.json
        run: bash scripts/upload-release-asset.sh
