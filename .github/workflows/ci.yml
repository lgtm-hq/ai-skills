---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

jobs:
  quality:
    # reusable-quality split upstream: quality-lint runs the checks and the
    # PR summary comment moved to publish-quality-summary, so this job no
    # longer needs pull-requests: write.
    permissions:
      contents: read
      packages: read
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@66cad82ead0e5d119928c895c7d7da9c837989e5
    with:
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
      # Override the reusable default (0.64.1 at this pin) so CI matches
      # pyproject.toml's lintro==0.74.0 and validate-lintro-version.yml.
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:ec90de3fd989e93be9c6734562e4d6217deb16bccd33d192b48fb8fe2ec54514

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@66cad82ead0e5d119928c895c7d7da9c837989e5
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
    permissions:
      contents: read
      pull-requests: write

  test:
    name: Run pytest suite
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@66cad82ead0e5d119928c895c7d7da9c837989e5
    with:
      python-version: "3.13"
      test-path: tests
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
    permissions:
      # actions: write is required at compile time by the reusable
      # workflow's aggregate job (matrix mode only, skipped here), which
      # merges coverage artifacts. Each called job still runs with only
      # its own declared subset; the test job itself declares
      # contents: read.
      actions: write
      contents: read
      pull-requests: write

  validate:
    name: Validate skill repository structure
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@66cad82ead0e5d119928c895c7d7da9c837989e5
    with:
      job-name: Validate skill repository structure
      setup-commands: bash scripts/install-validate-deps.sh
      script: scripts/validate.sh
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
    permissions:
      contents: read
      pull-requests: write
