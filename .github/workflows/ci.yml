---
name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lintro Quality Checks
    runs-on: ubuntu-latest
    container:
      # Reuse the lgtm-ci lintro image instead of vendoring shared CI scripts.
      # yamllint disable-line rule:line-length
      image: ghcr.io/lgtm-hq/py-lintro@sha256:9835baef95ee5161239cc25e596bd512143d4297442199782af833b14d07cd02
      options: --user 0

    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Add lintro to PATH
        shell: bash
        run: echo "/app/.venv/bin" >> "$GITHUB_PATH"

      - name: Run lintro quality checks
        shell: bash
        run: lintro chk

      - name: Install ripgrep for validate.sh
        shell: bash
        run: bash scripts/install-ripgrep.sh

      - name: Validate skill repository structure
        shell: bash
        run: bash scripts/validate.sh
