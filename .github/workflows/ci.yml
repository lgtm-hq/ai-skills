---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

jobs:
  quality:
    # reusable-quality split upstream: quality-lint runs the checks and the
    # PR summary comment moved to publish-quality-summary, so this job no
    # longer needs pull-requests: write.
    permissions:
      contents: read
      packages: read
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@17483d234808cb3a2019afdff0dea29593f24a05
    with:
      tooling-ref: "17483d234808cb3a2019afdff0dea29593f24a05"

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@17483d234808cb3a2019afdff0dea29593f24a05
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      tooling-ref: "17483d234808cb3a2019afdff0dea29593f24a05"
    permissions:
      contents: read
      pull-requests: write

  test:
    name: Run pytest suite
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@fc73b3ab8342a24597c12d137d6ff7fca84b9fe2
    with:
      python-version: "3.13"
      test-path: tests
      tooling-ref: "fc73b3ab8342a24597c12d137d6ff7fca84b9fe2"
    permissions:
      # contents/pages write are required at compile time by the reusable
      # workflow's publish job (skipped here: publish-results defaults to
      # false). Each called job still runs with only its own declared
      # subset; the test job itself declares contents: read.
      contents: write
      pages: write
      pull-requests: write

  validate:
    name: Validate skill repository structure
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@17483d234808cb3a2019afdff0dea29593f24a05
    with:
      job-name: Validate skill repository structure
      setup-commands: bash scripts/install-validate-deps.sh
      script: scripts/validate.sh
      tooling-ref: "17483d234808cb3a2019afdff0dea29593f24a05"
    permissions:
      contents: read
      pull-requests: write
