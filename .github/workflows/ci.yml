---
name: CI

'on':
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

jobs:
  verify-installers:
    name: Verify tool installer checksums
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          # Checkout plus the uv redirect and pinned Bun installer source.
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            codeload.github.com:443
            astral.sh:443
            releases.astral.sh:443
            raw.githubusercontent.com:443
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pinned installers without executing them
        run: bash scripts/ci/check-tool-installers.sh

  quality:
    # reusable-quality split upstream: quality-lint runs the checks and the
    # PR summary comment moved to publish-quality-summary, so this job no
    # longer needs pull-requests: write.
    permissions:
      contents: read
      packages: read
    # The upstream workflow has no prerequisite hook for nested TS projects.
    uses: ./.github/workflows/quality.yml
    with:
      egress-policy: block
      job-name: '🛠️ Lintro Code Quality'
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
      # Override the reusable default so CI matches
      # pyproject.toml's canonical lintro pin and validate-lintro-version.yml.
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:9f7510d65d063e2f0f1bdccb2b8f486d744ba21753341e75e5bbd8c9b29a9aae

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      egress-policy: block
      exit-code: ${{ needs.quality.outputs.exit-code }}
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
    permissions:
      contents: read
      pull-requests: write

  test:
    name: Run pytest suite
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      egress-policy: block
      python-version: '3.13'
      test-path: tests
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
    permissions:
      # actions: write is required at compile time by the reusable
      # workflow's aggregate job (matrix mode only, skipped here), which
      # merges coverage artifacts. Each called job still runs with only
      # its own declared subset; the test job itself declares
      # contents: read.
      actions: write
      contents: read
      pull-requests: write

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      job-name: '📚 Validate Skill Structure'
      setup-commands: bash scripts/install-validate-deps.sh
      script: scripts/validate.sh
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
      egress-policy: block
      egress-preset: quality
      # Harden-runner pre reads inputs only. setup installs ripgrep via apt and
      # uv via astral.sh, then uv sync against PyPI — pass the full quality
      # allowlist plus Ubuntu apt mirrors (not in github-tooling default).
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        release-assets.githubusercontent.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        github-releases.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
        docker.io:443
        registry-1.docker.io:443
        auth.docker.io:443
        production.cloudflare.docker.com:443
        production.cloudfront.docker.com:443
        pypi.org:443
        files.pythonhosted.org:443
        static.rust-lang.org:443
        bun.sh:443
        astral.sh:443
        releases.astral.sh:443
        sh.rustup.rs:443
        deb.debian.org:80
        registry.npmjs.org:443
        crates.io:443
        static.crates.io:443
        index.crates.io:443
        semgrep.dev:443
        metrics.semgrep.dev:443
        api.osv.dev:443
        api.deps.dev:443
        archive.ubuntu.com:80
        azure.archive.ubuntu.com:80
        security.ubuntu.com:80
        security.ubuntu.com:443
    permissions:
      contents: read
      pull-requests: write

  bake-vendor-plugins:
    needs: quality
    # Real bake (not --check against committed output). Fetches vendor
    # tarballs at the vendors.yaml pins; coverage lands in the job summary.
    permissions:
      contents: read
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      job-name: '🍞 Bake vendor plugins'
      setup-commands: bash scripts/install-validate-deps.sh
      script: scripts/ci/bake_vendor_plugins_gate.sh
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
      egress-policy: block
      egress-preset: quality
      # Same allowlist as validate: uv/PyPI plus GitHub tarball hosts.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        release-assets.githubusercontent.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        github-releases.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
        docker.io:443
        registry-1.docker.io:443
        auth.docker.io:443
        production.cloudflare.docker.com:443
        production.cloudfront.docker.com:443
        pypi.org:443
        files.pythonhosted.org:443
        static.rust-lang.org:443
        bun.sh:443
        astral.sh:443
        releases.astral.sh:443
        sh.rustup.rs:443
        deb.debian.org:80
        registry.npmjs.org:443
        crates.io:443
        static.crates.io:443
        index.crates.io:443
        semgrep.dev:443
        metrics.semgrep.dev:443
        api.osv.dev:443
        api.deps.dev:443
        archive.ubuntu.com:80
        azure.archive.ubuntu.com:80
        security.ubuntu.com:80
        security.ubuntu.com:443

  lock-build:
    needs: quality
    # Resolution lock gate: lock --fetch fills the source cache for the
    # committed ai-skills.lock (fetched bytes must match each sourceDigest),
    # then lock --check and the offline build must reproduce every digest.
    permissions:
      contents: read
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      job-name: '🔒 Lock check and offline build'
      setup-commands: bash scripts/install-validate-deps.sh
      script: scripts/ci/lock_build_gate.sh
      tooling-ref: 'b830ca6972f0c9cbaeb1363283de594f68d66acf' # v0.87.0
      egress-policy: block
      egress-preset: quality
      # Same allowlist as the vendor bake: uv/PyPI plus GitHub tarball hosts.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        release-assets.githubusercontent.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        github-releases.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
        docker.io:443
        registry-1.docker.io:443
        auth.docker.io:443
        production.cloudflare.docker.com:443
        production.cloudfront.docker.com:443
        pypi.org:443
        files.pythonhosted.org:443
        static.rust-lang.org:443
        bun.sh:443
        astral.sh:443
        releases.astral.sh:443
        sh.rustup.rs:443
        deb.debian.org:80
        registry.npmjs.org:443
        crates.io:443
        static.crates.io:443
        index.crates.io:443
        semgrep.dev:443
        metrics.semgrep.dev:443
        api.osv.dev:443
        api.deps.dev:443
        archive.ubuntu.com:80
        azure.archive.ubuntu.com:80
        security.ubuntu.com:80
        security.ubuntu.com:443

  ai-skills-validate:
    name: ai-skills validate --strict --terminology
    needs: quality
    # This catalog runs the same reusable workflow vendors call, pinned to the
    # commit under test; the script fills the cache with lock --fetch first.
    # Only this catalog opts into its own docs glossary lint.
    permissions:
      contents: read
    uses: ./.github/workflows/ai-skills-validate.yml
    with:
      engine-ref: ${{ github.sha }}
      manifest-path: ai-skills.yaml
      strict: true
      terminology: true

  fixture-vendor-validate:
    name: Fixture vendor calls reusable validate
    needs: quality
    # A generic fixture vendor (tests/fixtures/vendors/manifest) proves that a
    # vendor repository calling the reusable workflow passes.
    permissions:
      contents: read
    uses: ./.github/workflows/ai-skills-validate.yml
    with:
      engine-ref: ${{ github.sha }}
      manifest-path: tests/fixtures/vendors/manifest/ai-skills.yaml
      strict: true

  gateway:
    name: Gateway TypeScript and parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            releases.astral.sh:443
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read canonical Bun version
        id: bun-version
        run: bash scripts/ci/npm/read_bun_version.sh
      - name: Set up Bun
        # yamllint disable-line rule:line-length
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-version.outputs.bun-version }}
      - name: Set up uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Python test prerequisites
        run: uv sync --frozen
      - name: Check gateway package
        run: bash scripts/ci/npm/check_ai_skills_package.sh
