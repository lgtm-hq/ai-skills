---
name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    permissions:
      contents: read
      packages: read
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality.yml@fc73b3ab8342a24597c12d137d6ff7fca84b9fe2
    with:
      tooling-ref: "fc73b3ab8342a24597c12d137d6ff7fca84b9fe2"

  validate:
    name: Validate skill repository structure
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@fc73b3ab8342a24597c12d137d6ff7fca84b9fe2
    with:
      name: Validate skill repository structure
      setup-commands: bash scripts/install-validate-deps.sh
      script: scripts/validate.sh
      tooling-ref: "fc73b3ab8342a24597c12d137d6ff7fca84b9fe2"
    permissions:
      contents: read
      pull-requests: write
