---
name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    permissions:
      contents: read
      packages: read
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality.yml@79444626c1b3afa4d959b5840b4b5310a46a4095
    with:
      tooling-ref: "79444626c1b3afa4d959b5840b4b5310a46a4095"

  validate:
    name: Validate skill repository structure
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install ripgrep for validate.sh
        shell: bash
        run: bash scripts/install-ripgrep.sh

      - name: Validate skill repository structure
        shell: bash
        run: bash scripts/validate.sh
