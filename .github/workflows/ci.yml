---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lintro:
    permissions:
      contents: read
      packages: read
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality.yml@0de41c8e803ba2cb324dd9ec1d2e39eb870f9090

  validate:
    name: Validate skill repository structure
    needs: lintro
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install ripgrep for validate.sh
        shell: bash
        run: bash scripts/install-ripgrep.sh

      - name: Validate skill repository structure
        shell: bash
        run: bash scripts/validate.sh
