---
name: CI

"on":
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

jobs:
  quality:
    # reusable-quality split upstream: quality-lint runs the checks and the
    # PR summary comment moved to publish-quality-summary, so this job no
    # longer needs pull-requests: write.
    permissions:
      contents: read
      packages: read
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    with:
      job-name: "🛠️ Lintro Code Quality"
      tooling-ref: "c14fbb654af2fc59c4abd7435e85a269a57057fc" # v0.69.2
      # Override the reusable default (0.64.1 at this pin) so CI matches
      # pyproject.toml's lintro==0.142.0 and validate-lintro-version.yml.
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro@sha256:bf8ae37afa968c5972228cef6aa39ad4ead70561a2118b1ccfd316d1acc3155d

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      tooling-ref: "c14fbb654af2fc59c4abd7435e85a269a57057fc" # v0.69.2
    permissions:
      contents: read
      pull-requests: write

  test:
    name: Run pytest suite
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-python.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    with:
      python-version: "3.13"
      test-path: tests
      tooling-ref: "c14fbb654af2fc59c4abd7435e85a269a57057fc" # v0.69.2
    permissions:
      # actions: write is required at compile time by the reusable
      # workflow's aggregate job (matrix mode only, skipped here), which
      # merges coverage artifacts. Each called job still runs with only
      # its own declared subset; the test job itself declares
      # contents: read.
      actions: write
      contents: read
      pull-requests: write

  validate:
    needs: quality
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    with:
      job-name: "📚 Validate Skill Structure"
      setup-commands: bash scripts/install-validate-deps.sh
      script: scripts/validate.sh
      tooling-ref: "c14fbb654af2fc59c4abd7435e85a269a57057fc" # v0.69.2
      egress-policy: block
      egress-preset: quality
      # Harden-runner pre reads inputs only. setup installs ripgrep via apt and
      # uv via astral.sh, then uv sync against PyPI — pass the full quality
      # allowlist plus Ubuntu apt mirrors (not in github-tooling default).
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        release-assets.githubusercontent.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        github-releases.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
        docker.io:443
        registry-1.docker.io:443
        auth.docker.io:443
        production.cloudflare.docker.com:443
        production.cloudfront.docker.com:443
        pypi.org:443
        files.pythonhosted.org:443
        static.rust-lang.org:443
        bun.sh:443
        astral.sh:443
        releases.astral.sh:443
        sh.rustup.rs:443
        deb.debian.org:80
        registry.npmjs.org:443
        crates.io:443
        static.crates.io:443
        index.crates.io:443
        semgrep.dev:443
        metrics.semgrep.dev:443
        api.osv.dev:443
        api.deps.dev:443
        archive.ubuntu.com:80
        azure.archive.ubuntu.com:80
        security.ubuntu.com:80
        security.ubuntu.com:443
    permissions:
      contents: read
      pull-requests: write

  bake-vendor-plugins:
    needs: quality
    # Real bake (not --check against committed output). Fetches vendor
    # tarballs at the vendors.yaml pins; coverage lands in the job summary.
    permissions:
      contents: read
      pull-requests: write
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate.yml@c14fbb654af2fc59c4abd7435e85a269a57057fc  # v0.69.2
    with:
      job-name: "🍞 Bake vendor plugins"
      setup-commands: bash scripts/install-validate-deps.sh
      script: scripts/ci/bake_vendor_plugins_gate.sh
      tooling-ref: "c14fbb654af2fc59c4abd7435e85a269a57057fc" # v0.69.2
      egress-policy: block
      egress-preset: quality
      # Same allowlist as validate: uv/PyPI plus GitHub tarball hosts.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        release-assets.githubusercontent.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        github-releases.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
        docker.io:443
        registry-1.docker.io:443
        auth.docker.io:443
        production.cloudflare.docker.com:443
        production.cloudfront.docker.com:443
        pypi.org:443
        files.pythonhosted.org:443
        static.rust-lang.org:443
        bun.sh:443
        astral.sh:443
        releases.astral.sh:443
        sh.rustup.rs:443
        deb.debian.org:80
        registry.npmjs.org:443
        crates.io:443
        static.crates.io:443
        index.crates.io:443
        semgrep.dev:443
        metrics.semgrep.dev:443
        api.osv.dev:443
        api.deps.dev:443
        archive.ubuntu.com:80
        azure.archive.ubuntu.com:80
        security.ubuntu.com:80
        security.ubuntu.com:443
