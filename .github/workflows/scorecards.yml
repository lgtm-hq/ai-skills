---
name: Security - OpenSSF Scorecard

'on':
  push:
    branches: [main]
  schedule:
    # Weekly, Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecards:
    # lgtm-ci owns the scorecard scan; this repo stays a thin caller.
    # Held at v0.75.2 while the rest of the repo is on v0.77.5: the v0.77
    # reusable-scorecards is rejected by the Scorecard API publish verifier
    # (lgtm-hq/lgtm-ci#1173). Move this pin once the fix is released.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-scorecards.yml@b777111fb3aaa6f09589fb029f0094a05dd76003 # v0.77.7
    with:
      # Re-enabled after lgtm-ci v0.52.4 (lgtm-ci#535).
      publish-results: true
      egress-policy: block
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        gcr.io:443
        api.osv.dev:443
        api.scorecard.dev:443
        api.securityscorecards.dev:443
        agent.api.stepsecurity.io:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        release-assets.githubusercontent.com:443
        oss-fuzz-build-logs.storage.googleapis.com:443
        ossf.github.io:443
        www.bestpractices.dev:443
    permissions:
      # Elevated only where the reusable scorecards job requires: publish the
      # SARIF to the Security tab (security-events) and sign results via OIDC
      # (id-token). Everything else stays contents: read.
      contents: read
      security-events: write
      id-token: write
