---
name: "Security: Dependency Review"

"on":
  pull_request:
    branches: [main]
  merge_group:

# Disable all token scopes by default; job grants only what review needs.
permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-dependency-review.yml@66cad82ead0e5d119928c895c7d7da9c837989e5
    with:
      fail-on-severity: high
      tooling-ref: "66cad82ead0e5d119928c895c7d7da9c837989e5"
      egress-policy: block
      egress-preset: scorecard
      allowed-endpoints-mode: append
      allowed-endpoints: >
        api.deps.dev:443
        release-assets.githubusercontent.com:443
    permissions:
      # Read repository manifests and lockfiles.
      contents: read
      # Read pull-request metadata for dependency review.
      pull-requests: read
