---
name: "Security: Dependency Review"

"on":
  pull_request:
    branches: [main]
  merge_group:

# Disable all token scopes by default; job grants only what review needs.
permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-dependency-review.yml@f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36  # v0.69.8
    with:
      fail-on-severity: high
      tooling-ref: "f0e999fd9934a43c8d1d6a1c68ee2d1a8a978f36"  # v0.69.8
      egress-policy: block
      egress-preset: scorecard
      # replace: harden-runner pre cannot see resolved presets; pass the full
      # allowlist (scorecard default + deps.dev) as a folded input.
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        gcr.io:443
        api.osv.dev:443
        api.scorecard.dev:443
        api.securityscorecards.dev:443
        api.deps.dev:443
        release-assets.githubusercontent.com:443
    permissions:
      # Read repository manifests and lockfiles.
      contents: read
      # Read pull-request metadata for dependency review.
      pull-requests: read
