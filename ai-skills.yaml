---
apiVersion: ai-skills.dev/v1
publisher:
  id: lgtm-hq
  repo: lgtm-hq/ai-skills
packages:
  - id: git-pr
    name: Git & PR Workflow
    description: Branching, commits, rebases, and pull requests.
    capabilities:
      - id: branch
        path: skills/branch
      - id: commit
        path: skills/commit
      - id: rebase
        path: skills/rebase
      - id: pr
        path: skills/pr
      - id: reconcile
        path: skills/reconcile
      - id: issue
        path: skills/issue
    x-legacy-group: git-pr
  - id: review
    name: Review
    description: >-
      Lint, test, and AI review before pushing or opening a PR.
    capabilities:
      - id: lint
        path: skills/lint
      - id: test
        path: skills/test
      - id: greptile
        path: skills/greptile
      - id: coderabbit
        path: skills/coderabbit
      - id: lintro-review
        path: skills/lintro-review
    x-legacy-group: review
  - id: standards
    name: Standards
    description: >-
      Language and CI coding standards applied while writing code.
    capabilities:
      - id: stand-general
        path: skills/stand-general
      - id: stand-py
        path: skills/stand-py
      - id: stand-ts
        path: skills/stand-ts
      - id: stand-rust
        path: skills/stand-rust
      - id: stand-odin
        path: skills/stand-odin
      - id: stand-ci
        path: skills/stand-ci
    x-legacy-group: standards
  - id: raycast
    name: Raycast
    description: >-
      Raycast extension development and store submissions.
    capabilities:
      - id: raycast
        path: skills/raycast
      - id: pr-raycast
        path: skills/pr-raycast
    x-legacy-group: raycast
  - id: analysis
    name: Analysis
    description: >-
      Manual pre-review analysis of code, projects, and test suites.
    capabilities:
      - id: analyze-code
        path: skills/analyze-code
      - id: analyze-project
        path: skills/analyze-project
      - id: analyze-tests
        path: skills/analyze-tests
      - id: audit-merges
        path: skills/audit-merges
      - id: sweep-prs
        path: skills/sweep-prs
    x-legacy-group: analysis
  - id: subagents
    name: Subagents
    description: >-
      Autonomous agents that shepherd PRs and work issue backlogs.
    capabilities:
      - id: babysit-pr
        path: skills/babysit-pr
      - id: backlog
        path: skills/backlog
      - id: implement-issues
        path: skills/implement-issues
      - id: which-pr
        path: skills/which-pr
    x-legacy-group: subagents
  - id: testing
    name: Testing
    description: Playwright and BATS test-writing standards.
    capabilities:
      - id: test-api
        path: skills/test-api
      - id: test-ui
        path: skills/test-ui
      - id: test-ui-qsf
        path: skills/test-ui-qsf
      - id: test-shell
        path: skills/test-shell
    x-legacy-group: testing
  - id: other
    capabilities:
      - id: jira
        path: skills/jira
      - id: lintro-add
        path: skills/lintro-add
      - id: lintro-verify
        path: skills/lintro-verify
      - id: properize
        path: skills/properize
      - id: scorecard
        path: skills/scorecard
      - id: turbo-add
        path: skills/turbo-add
      - id: turbo-test
        path: skills/turbo-test
      - id: turbo-verify
        path: skills/turbo-verify
    x-legacy-ungrouped: true
