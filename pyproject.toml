[project]
name = "ai-skills"
version = "0.5.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "loguru>=0.7.3",
  # Exact pin kept in sync with the py-lintro image CI runs via
  # reusable-quality-lint.yml (ghcr.io/lgtm-hq/py-lintro 0.64.1). The
  # validate-lintro-version workflow fails the build if this drifts from
  # the pinned image, so local `uv run lintro chk` matches CI exactly.
  "lintro==0.64.1",
  "pip-audit>=2.9.0",
  "pytest-cov>=7.0.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "pytest>=9.0.3",
  "pyyaml>=6.0.2",
  "mypy>=2.1.0",
  "assertpy>=1.1",
  # validate.sh requires the rg binary; the wheel ships it so pytest is
  # self-contained on CI runners without system ripgrep.
  "ripgrep>=15.1.0",
]

[tool.bandit]
# B101 (assert usage) stays enabled: tests assert via assertpy (#88), so any
# bare `assert` statement anywhere in the repo is a lint failure by design.
skips = []
