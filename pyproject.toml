[project]
name = "ai-skills"
version = "0.1.16"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "loguru>=0.7.3",
  "lintro>=0.62.1",
  "pip-audit>=2.9.0",
  "pytest-cov>=7.0.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "pytest>=9.0.3",
  "pyyaml>=6.0.2",
  "assertpy>=1.1",
  "mypy>=2.1.0",
]

[tool.bandit]
# B101 (assert usage) stays enabled: tests assert via assertpy (#88), so any
# bare `assert` statement anywhere in the repo is a lint failure by design.
skips = []
