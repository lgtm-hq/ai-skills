[project]
name = "ai-skills"
version = "0.30.7"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "loguru>=0.7.3",
  # Exact pin kept in sync with the py-lintro image CI runs via
  # ci.yml's lintro-image override; this dependency is the canonical version pin.
  # The validate-lintro-version workflow fails the build if this drifts
  # from the pinned image, so local `uv run lintro chk` matches CI.
  "lintro==0.173.7",
  "pytest-cov>=7.0.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "pytest>=9.0.3",
  "pyyaml>=6.0.2",
  "mypy>=2.1.0",
  "assertpy>=1.1",
  # validate.sh requires the rg binary; the wheel ships it so pytest is
  # self-contained on CI runners without system ripgrep.
  "ripgrep>=15.1.0",
  # Bake validates internal markdown destinations via a CommonMark parse.
  "markdown-it-py>=4.2.0",
]

[tool.bandit]
# B101 (assert usage) stays enabled: tests assert via assertpy (#88), so any
# bare `assert` statement anywhere in the repo is a lint failure by design.
skips = []

[tool.pylint.main]
# Test arrangements deliberately repeat fixture data; check production code.
ignore-paths = ["(^|/)tests/"]

[tool.pylint.messages_control]
# Ruff, mypy, and pydoclint own per-file checks. Pylint adds cross-file analysis.
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
# Independent CLIs repeat short argparse wrappers and exception tuples.
min-similarity-lines = 12

[tool.pytest.ini_options]
testpaths = ["tests"]
