---
# Lintro Configuration
# https://github.com/lgtm-hq/py-lintro
#
# All bundled tools are enabled; each tool no-ops or skips when it has no
# matching files in this repository.

enforce:
  line_length: 88

execution:
  enabled_tools:
    - actionlint
    - astro-check
    - bandit
    - black
    - cargo_audit
    - cargo_deny
    - clippy
    - gitleaks
    - hadolint
    - markdownlint
    - mypy
    - osv_scanner
    - oxfmt
    - oxlint
    - prettier
    - pydoclint
    - pytest
    - ruff
    - rustfmt
    - semgrep
    - shellcheck
    - shfmt
    - sqlfluff
    - svelte-check
    - taplo
    - tsc
    - vue-tsc
    - yamllint
  tool_order: 'priority'
  fail_fast: false

defaults:
  prettier:
    semi: true
    singleQuote: true
    tabWidth: 2
    printWidth: 88
    trailingComma: 'es5'
    overrides:
      - files: '*.md'
        options:
          printWidth: 88

  yamllint:
    extends: 'default'
    rules:
      comments-indentation: 'disable'
      comments:
        min-spaces-from-content: 1
      truthy:
        check-keys: true
      line-length:
        max: 88
        allow-non-breakable-inline-mappings: true

tools:
  actionlint:
    enabled: true

  astro-check:
    enabled: true

  bandit:
    enabled: true

  black:
    enabled: true

  cargo_audit:
    enabled: true

  cargo_deny:
    enabled: true

  clippy:
    enabled: true

  gitleaks:
    enabled: true

  hadolint:
    enabled: true

  markdownlint:
    enabled: true

  mypy:
    enabled: true

  osv_scanner:
    enabled: true

  oxfmt:
    enabled: true

  oxlint:
    enabled: true

  prettier:
    enabled: true

  pydoclint:
    enabled: true

  pytest:
    enabled: true

  ruff:
    enabled: true

  rustfmt:
    enabled: true

  semgrep:
    enabled: true

  shellcheck:
    enabled: true

  shfmt:
    enabled: true

  sqlfluff:
    enabled: true

  svelte-check:
    enabled: true

  taplo:
    enabled: true

  tsc:
    enabled: true

  vue-tsc:
    enabled: true

  yamllint:
    enabled: true
