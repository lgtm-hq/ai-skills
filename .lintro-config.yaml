---
# Lintro Configuration
# https://github.com/lgtm-hq/py-lintro
#
# All current and future bundled tools run by default. Tools with no matching
# files no-op; any explicit disable below must explain its reason.

enforce:
  line_length: 88

execution:
  tool_order: 'priority'
  fail_fast: false
  parallel: true

defaults:
  prettier:
    semi: true
    singleQuote: true
    tabWidth: 2
    printWidth: 88
    trailingComma: 'es5'
    overrides:
      - files: '*.md'
        options:
          printWidth: 88

  markdownlint:
    MD013:
      line_length: 88
      code_blocks: false
      tables: false

  yamllint:
    extends: 'default'
    rules:
      comments-indentation: 'disable'
      comments:
        min-spaces-from-content: 1
      truthy:
        check-keys: true
      line-length:
        max: 88
        allow-non-breakable-inline-mappings: true

tools:
  actionlint:
    enabled: true

  astro-check:
    enabled: true

  bandit:
    enabled: true

  black:
    enabled: true

  cargo_audit:
    enabled: true

  cargo_deny:
    enabled: true

  clippy:
    enabled: true

  gitleaks:
    enabled: true

  hadolint:
    enabled: true

  idiom-review:
    enabled: false # Paid AI review requires explicit opt-in (#596 cost gate).

  markdownlint:
    enabled: true

  mypy:
    enabled: true

  osv_scanner:
    enabled: true

  oxfmt:
    enabled: true

  oxlint:
    enabled: true

  prettier:
    enabled: true

  pydoclint:
    enabled: true

  pytest:
    enabled: true

  ruff:
    enabled: true

  rustfmt:
    enabled: true

  semgrep:
    enabled: true

  shellcheck:
    enabled: true

  shfmt:
    enabled: true

  sqlfluff:
    enabled: true

  svelte-check:
    enabled: true

  taplo:
    enabled: true

  tsc:
    enabled: true

  vue-tsc:
    enabled: true

  yamllint:
    enabled: true
